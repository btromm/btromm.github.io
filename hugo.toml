baseURL = 'https://btromm.github.io/'
languageCode = 'en-us'
title = 'bobby tromm'
theme = 'typo'

# Google analytics code
googleAnalytics = "G-DCHF3FSFSJ"

[caches]
   [caches.images]
      dir = ':cacheDir/images'

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "a blog about neuroscience, complexity, intelligence, and consciousness"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = true # Hide header on home page
showTags = true

showFooter = true
footerContent = "copyright &copy; 2025. made with [hugo](https://gohugo.io/) and [typo](https://github.com/tomfran/typo)"

# Intro on main page, content is markdown
homeIntroTitle = ''
homeIntroContent = """
i'm a neuroscientist interested in how brains interact with consciousness.

this site is a work in progress. i am currently migrating from my previous site using Jekyll to this new site, using [hugo](https://gohugo.io). some links may be broken, and some content may be missing. please bear with me as i work on it.
"""

# Collection to display on home
homeCollectionTitle = 'recent'
homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2 Jan 2006'

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = false
home = "Home"

# Social icons
[[params.social]]
name = "bluesky"
url = "https://bsky.app/profile/btromm.bsky.social"

[[params.social]]
name = "twitter"
url = "https://x.com/b_tromm"

[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/btromm/"

[[params.social]]
name = "github"
url = "https://github.com/btromm"

# Main menu pages
[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "publications"
url = "/publications"

[[params.menu]]
name = "cv"
url = "/pdf/cv.pdf"

# Syntax highlight on code blocks
[markup]
[markup.highlight]
style = 'algol'

# Table of contents configuration
[markup.tableOfContents]
endLevel = 4   # Include headings up to h4
ordered = false
startLevel = 2

# Giscus comments
[params.giscus]
enable = false
repo = "btromm/btromm.github.io"
repoid = "repoId"
category = "General"
categoryid = "categoryId"
mapping = "pathname"
theme = "preferred_color_scheme"
