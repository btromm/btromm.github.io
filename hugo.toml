baseURL = 'https://btromm.github.io/'
locale = 'en-us'
title = 'Bobby Tromm'
theme = 'typo'
timeout = '10m'

# Google analytics code
googleAnalytics = "G-DCHF3FSFSJ"

[caches]
   [caches.images]
      dir = ':cacheDir/images'

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "Bobby (Robert) Tromm, PhD student in neuroscience and machine learning at UCL with Caswell Barry and Tim Behrens, working on cognitive maps and grid codes."

# Hero image (path relative to static folder)
# heroImage = "/images/hero.jpeg"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = true # Hide header on home page
showTags = true

showFooter = true
footerContent = "[resources](/resources) &middot; &copy; 2026 Bobby Tromm. made with [hugo](https://gohugo.io/) and [typo](https://github.com/tomfran/typo)"

# Photo beside the intro and in link previews (path inside static/).
# Nothing shows until the file exists.
homePhoto = "/images/headshot.jpg"

# Role and affiliation line under the name on the home page (markdown)
homeSubtitle = "PhD student in neuroscience & machine learning · University College London"

# Intro on main page, content is markdown
homeIntroTitle = ""
homeIntroContent = """
I am a PhD student in neuroscience and machine learning at University College London, supervised by Caswell Barry and Tim Behrens. I'm interested in how brains and machines learn abstract models of the world: what the internal representations that support flexible behaviour look like, and why they take the form they do. I use reinforcement learning and successor-representation models to work out which architectures, objectives and policies give rise to grid-like codes.

Before my PhD, I was a research engineer in Nikolas Karalis's [Neuronal Circuits & Brain Dynamics](https://www.neuronaldynamics.eu/) group at the Paris Brain Institute. Earlier, I was a visiting researcher at the University of Oxford's [Centre for Eudaimonia and Human Flourishing](https://hedonia.kringelbach.org/), and a research assistant with Jan Ramaekers at Maastricht University and in [Eve Marder's lab](https://sites.google.com/brandeis.edu/marder-lab/) at Brandeis University.
"""

# News on home comes from data/news.yaml (newest first)
homeNewsTitle = 'news'

# Latest posts shown on home, under the news
homeCollectionTitle = 'writing'
homeCollection = 'posts'
homeCollectionCount = 3

# Bolded in publication author lists (regular expression)
publicationsHighlight = '(Robert|R\.) Tromm'

# Lists parameters
paginationSize = 100
listSummaries = false
listDateFormat = '2 Jan 2006'

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = false
home = "Home"

# Social icons
[[params.social]]
name = "gmail"
label = "email"
url = "mailto:robert.tromm.25@ucl.ac.uk"

[[params.social]]
name = "github"
label = "github"
url = "https://github.com/btromm"

[[params.social]]
name = "googlescholar"
label = "scholar"
url = "https://scholar.google.com/citations?user=hJl27VcAAAAJ&hl=en"

[[params.social]]
name = "twitter"
label = "x / twitter"
url = "https://x.com/b_tromm"

# Main menu pages (research first; resources lives in the footer)
[[params.menu]]
name = "research"
url = "/research"

[[params.menu]]
name = "publications"
url = "/publications"

[[params.menu]]
name = "cv"
url = "/pdf/cv.pdf"

[[params.menu]]
name = "posts"
url = "/posts"

[[params.menu]]
name = "photos"
url = '/photos'

# Syntax highlight on code blocks
[markup]
   [markup.goldmark.renderer]
      unsafe = true
   [markup.highlight]
      # Use CSS classes so Typo's syntax-highlighting.css styles code in light and dark mode
      noClasses = false

# Table of contents configuration
[markup.tableOfContents]
endLevel = 4   # Include headings up to h4
ordered = false
startLevel = 2

# Giscus comments
[params.giscus]
enable = false
repo = "btromm/btromm.github.io"
repoid = "repoId"
category = "General"
categoryid = "categoryId"
mapping = "pathname"
theme = "preferred_color_scheme"

[outputs]
  home = ['html']
  section = ['html', 'rss']
  taxonomy = ['html']
  term = ['html']

[params.author]
    name = "Bobby Tromm"
    email = "bobby.tromm@gmail.com"
